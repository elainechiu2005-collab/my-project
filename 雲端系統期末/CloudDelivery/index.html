<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>CloudDelivery 分散式路徑最佳化系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { border: 2px solid #4A2E80; background-color: #f8f9fa; cursor: crosshair; }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-[#4A2E80] mb-6">CloudDelivery 叢集監控面板</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4">1. 設定點位</h2>
                <p class="text-gray-600 mb-4 text-sm">請在下方畫布隨機點擊產生點，完成後點擊提交。</p>
                <canvas id="map" width="500" height="400" class="w-full"></canvas>
                
                <div class="mt-4 flex gap-4">
                    <button id="clearBtn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">清除點位</button>
                    <button id="submitBtn" class="px-4 py-2 bg-[#4A2E80] text-white rounded hover:bg-[#382260] font-bold">提交叢集運算</button>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-bold mb-4">🖥️ 節點資源監控</h2>
                    <div id="workers-container" class="space-y-3">
                        <p class="text-gray-500 text-sm">等待 Worker 啟動回報心跳...</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-bold mb-4">📋 任務佇列狀態</h2>
                    <div class="overflow-y-auto max-h-64">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 border-b">
                                <tr>
                                    <th class="p-2">任務 ID</th>
                                    <th class="p-2">狀態</th>
                                    <th class="p-2">操作</th>
                                </tr>
                            </thead>
                            <tbody id="tasks-table">
                            </tbody>
                        </table>
                    </div>
                </div>
                
                 <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                    <h2 class="text-lg font-bold">當前最佳路徑長度</h2>
                    <p id="best-dist" class="text-2xl font-bold text-green-600 mt-2">--</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('map');
        const ctx = canvas.getContext('2d');
        let points = [];

        // 繪製背景網格線
        function drawGrid() {
            const gridSize = 40; // 每一格的大小 (40px)
            ctx.strokeStyle = '#e5e7eb'; // Tailwind 的淺灰色 (gray-200)
            ctx.lineWidth = 1;

            // 畫垂直線
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            // 畫水平線
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // 畫布點擊事件
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            // 處理縮放比例
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);
            
            points.push([x, y]);
            drawPoints();
        });

        function drawPoints() {
            // 1. 先清空整個畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. 鋪上背景網格線
            drawGrid(); 

            // 3. 在網格上層畫出紅點與文字
            points.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p[0], p[1], 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#ef4444'; // 紅色
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index, p[0], p[1]);
            });
        }
        
        function drawRoute(path) {
            drawPoints(); // 先重繪點
            if (!path || path.length < 2) return;
            
            ctx.beginPath();
            ctx.moveTo(path[0][0], path[0][1]);
            for(let i=1; i<path.length; i++){
                ctx.lineTo(path[i][0], path[i][1]);
            }
            ctx.strokeStyle = '#22c55e'; // 綠色連線
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        document.getElementById('clearBtn').addEventListener('click', async () => {
            points = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('best-dist').innerText = '--'; // 清空畫面上的數字
            
            // 通知 Master 後端清空 Queue 與最佳路徑記憶
            await fetch('/api/reset', { method: 'POST' });
        });

        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (points.length < 2) {
                alert("請至少點擊 2 個點");
                return;
            }

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({points: points})
                });

                if (!response.ok) {
                    const text = await response.text();
                    alert(`提交失敗：${text}`);
                    return;
                }

                const result = await response.json();
                alert(result.message || '已成功送出任務');
            } catch (err) {
                alert('提交失敗，請檢查是否與 Master 連線正常。');
                console.error(err);
            }
        });

        async function cancelTask(taskId) {
            await fetch(`/api/cancel/${taskId}`, { method: 'POST' });
        }

        // WebSocket 狀態接收與畫面更新
        const ws = new WebSocket(`ws://${window.location.host}/ws/dashboard`);
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // 1. 更新 Worker CPU 狀態
            const workersDiv = document.getElementById('workers-container');
            let workerHtml = '';
            for (const [w_id, w_data] of Object.entries(data.workers)) {
                // 如果超過 5 秒沒心跳，標記為離線
                const isDown = (Date.now()/1000 - w_data.last_seen) > 5;
                const statusColor = isDown ? 'bg-red-500' : 'bg-green-500';
                const cpu = w_data.cpu_usage || 0;
                
                workerHtml += `
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded border">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full ${statusColor}"></span>
                            <span class="font-bold">${w_id}</span>
                        </div>
                        <div class="flex items-center gap-2 w-1/2">
                            <div class="w-full bg-gray-200 rounded-full h-2.5">
                              <div class="bg-[#4A2E80] h-2.5 rounded-full transition-all" style="width: ${cpu}%"></div>
                            </div>
                            <span class="text-xs w-12 text-right">${cpu}%</span>
                        </div>
                    </div>
                `;
            }
            if(workerHtml) workersDiv.innerHTML = workerHtml;

            // 2. 更新任務狀態表
            const tasksTable = document.getElementById('tasks-table');
            let taskHtml = '';
            for (const [t_id, t_data] of Object.entries(data.tasks)) {
                let statusBadge = '';
                let btnHtml = '';
                
                if (t_data.status === 'Queued') {
                    statusBadge = '<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs">排隊中</span>';
                    btnHtml = `<button onclick="cancelTask('${t_id}')" class="text-red-500 hover:text-red-700 text-xs">取消</button>`;
                } else if (t_data.status === 'Processing') {
                    statusBadge = '<span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs animate-pulse">運算中</span>';
                } else if (t_data.status === 'Completed') {
                    statusBadge = '<span class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">完成</span>';
                } else {
                    statusBadge = '<span class="px-2 py-1 bg-gray-100 text-gray-800 rounded text-xs line-through">已取消</span>';
                }

                taskHtml += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 font-mono text-xs">${t_id.substring(0, 15)}...</td>
                        <td class="p-2">${statusBadge}</td>
                        <td class="p-2">${btnHtml}</td>
                    </tr>
                `;
            }
            tasksTable.innerHTML = taskHtml;
            
            // 3. 更新最佳路徑
            if (data.global_best.min_distance !== null && data.global_best.min_distance !== "inf") {
                document.getElementById('best-dist').innerText = parseFloat(data.global_best.min_distance).toFixed(2);
                drawRoute(data.global_best.best_path);
            }
        };
        drawGrid();
    </script>
</body>
</html>
